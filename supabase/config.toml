project_id = "yttityeijqtviwybvcdo"

# Avoid Windows Hyper-V excluded ranges that block default 54321–54335.
[api]
port = 55001

[db]
port = 55002

[db.pooler]
enabled = false
port = 55005

[studio]
port = 55003

[analytics]
enabled = false
port = 55007

[auth]
site_url = "http://localhost:8081"
additional_redirect_urls = [
  "http://localhost:8081/**",
  "http://127.0.0.1:8081/**",
  "http://localhost:8080/**",
  "http://127.0.0.1:8080/**",
  "http://localhost:3000/**",
  "http://127.0.0.1:3000/**",
]

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
skip_nonce_check = false
